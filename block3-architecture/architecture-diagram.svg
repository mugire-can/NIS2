<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Segmented IT/OT network architecture for HydroRegie</title>
<desc>Three-zone network diagram: Corporate IT zone connected through a firewall to an Industrial DMZ, connected through a second firewall to the OT/SCADA zone, with an external internet box feeding into the Corporate IT zone.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="660" fill="#ffffff"/>

<rect x="260" y="20" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2C2C2A">Internet / vendors</text>
<line x1="340" y1="56" x2="340" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="45" y="90" width="590" height="150" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="65" y="118" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Corporate IT zone</text>
<text x="65" y="135" font-family="sans-serif" font-size="12" fill="#185FA5">Office network</text>

<rect x="65" y="165" width="170" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="150" y="191" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Workstations</text>

<rect x="255" y="165" width="170" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="191" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Business apps</text>

<rect x="445" y="165" width="170" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="191" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">VPN gateway</text>

<line x1="340" y1="240" x2="340" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="264" font-family="sans-serif" font-size="12" fill="#444441">FW1 - IT/OT boundary</text>

<rect x="45" y="280" width="590" height="150" rx="20" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="65" y="308" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Industrial DMZ</text>
<text x="65" y="325" font-family="sans-serif" font-size="12" fill="#854F0B">Controlled data exchange</text>

<rect x="65" y="355" width="170" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="150" y="381" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Historian</text>

<rect x="255" y="355" width="170" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="381" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Patch relay</text>

<rect x="445" y="355" width="170" height="44" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="530" y="381" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Jump host</text>

<line x1="340" y1="430" x2="340" y2="468" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="454" font-family="sans-serif" font-size="12" fill="#444441">FW2 - DMZ/OT boundary</text>

<rect x="45" y="470" width="590" height="150" rx="20" fill="#FCEBEB" stroke="#791F1F" stroke-width="0.5"/>
<text x="65" y="498" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">OT / SCADA zone</text>
<text x="65" y="515" font-family="sans-serif" font-size="12" fill="#791F1F">Water treatment control</text>

<rect x="65" y="545" width="170" height="44" rx="8" fill="#F7C1C1" stroke="#791F1F" stroke-width="0.5"/>
<text x="150" y="571" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">SCADA / HMI</text>

<rect x="255" y="545" width="170" height="44" rx="8" fill="#F7C1C1" stroke="#791F1F" stroke-width="0.5"/>
<text x="340" y="571" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">PLC network</text>

<rect x="445" y="545" width="170" height="44" rx="8" fill="#F7C1C1" stroke="#791F1F" stroke-width="0.5"/>
<text x="530" y="571" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Field devices</text>
</svg>
