<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Incident response chronology for HydroRegie</title>
<desc>Four-stage flowchart: Detection at 0-4 hours, Qualification at 4-6 hours, Notification at 24 and 72 hours, Remediation up to 30 days, connected by arrows in sequence.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="170" fill="#ffffff"/>

<text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Ransomware incident - corporate IT, day 1</text>

<rect x="50" y="60" width="130" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Detection</text>
<text x="115" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">0-4h</text>

<line x1="180" y1="88" x2="198" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="60" width="130" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="265" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Qualification</text>
<text x="265" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">4-6h</text>

<line x1="330" y1="88" x2="348" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="350" y="60" width="130" height="56" rx="8" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="415" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Notification</text>
<text x="415" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">24h / 72h</text>

<line x1="480" y1="88" x2="498" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="500" y="60" width="130" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="565" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Remediation</text>
<text x="565" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">up to 30d</text>

<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Firewall FW1 held: OT/SCADA zone unaffected throughout</text>
</svg>
